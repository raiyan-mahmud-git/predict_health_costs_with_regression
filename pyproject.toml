[build-system]
requires = ["setuptools==75.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "health-costs-regression"
version = "1.0.0"
description = "A reproducible teaching project for health insurance expense regression."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "scikit-learn==1.5.2",
  "joblib==1.4.2",
]

[project.optional-dependencies]
fcc = ["tensorflow==2.16.2", "keras==3.4.1", "matplotlib==3.9.2"]
dev = ["pytest==8.3.3", "nbconvert==7.16.4", "nbformat==5.10.4", "ipykernel==6.29.5"]

[project.scripts]
health-costs = "health_costs.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
